<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENHYPEN — Music Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;500;700&family=Syne+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Dynamic Theme Variables (RGB format for opacity manipulation) */
      --bg-color: 15, 10, 10;     /* Deep neutral base */
      --acc-color: 200, 200, 200; /* Silver base */

      --bg:     rgb(var(--bg-color));
      --s1:     rgba(var(--bg-color), 0.6);
      --s2:     rgba(var(--bg-color), 0.8);
      --s3:     rgba(255, 255, 255, 0.1);
      
      --acc:    rgb(var(--acc-color));
      --acc2:   rgba(var(--acc-color), 0.12);
      
      --text:   #efefef;
      --dim:    rgba(255, 255, 255, 0.5);
      --dim2:   rgba(255, 255, 255, 0.7);
      --border: rgba(255, 255, 255, 0.08);

      /* Era accent colors */
      --border-clr:    #4fc3f7;
      --dimension-clr: #b39ddb;
      --manifesto-clr: #ef9a9a;
      --romance-clr:   #f48fb1;
      --horizon-clr:   #c6f135;
      --special-clr:   #ffd54f;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      height: 100%; 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Syne', sans-serif; 
      overflow: hidden; 
      transition: background 1s ease;
    }

    /* ─── Layout & Glassmorphism ──────────────────────────────────────────── */
    .shell {
      display: grid;
      grid-template-rows: 64px 1fr 108px;
      grid-template-columns: 340px 1fr;
      grid-template-areas: "hd hd" "sb mn" "pb pb";
      height: 100vh;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    header {
      grid-area: hd;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 32px;
      background: var(--s1);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 7px;
      color: var(--text);
      line-height: 1;
      flex-shrink: 0;
    }

    .sep { width: 1px; height: 24px; background: var(--border); }

    .tagline { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); }

    .now-header {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 420px;
      min-width: 0;
    }

    .nh-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--acc);
      flex-shrink: 0;
      animation: blink 2s ease-in-out infinite;
      box-shadow: 0 0 8px var(--acc);
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    .nh-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nh-album {
      font-size: 11px;
      color: var(--dim2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    /* ─── Sidebar ─────────────────────────────────────────── */
    aside {
      grid-area: sb;
      background: var(--s1);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .era-tabs {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .era-tabs::-webkit-scrollbar { display: none; }

    .era-tab {
      flex-shrink: 0;
      padding: 6px 14px;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid var(--border);
      color: var(--dim2);
      cursor: pointer;
      background: transparent;
      border-radius: 20px;
      font-family: 'Syne', sans-serif;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .era-tab:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }

    .era-tab.active {
      background: var(--acc2);
      border-color: var(--acc);
      color: var(--acc);
    }

    .song-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--s3) transparent;
      padding-bottom: 20px;
    }

    .album-group { padding-top: 10px; }

    .album-header {
      position: sticky;
      top: 0;
      background: rgba(var(--bg-color), 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      z-index: 2;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .album-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 2px;
      color: var(--text);
    }

    .album-year {
      font-family: 'Syne Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      margin-top: 2px;
    }

    .album-header::before {
      content: '';
      display: block;
      width: 24px;
      height: 2px;
      margin-bottom: 8px;
      border-radius: 2px;
    }

    [data-era="border"]     .album-header::before { background: var(--border-clr); }
    [data-era="dimension"]  .album-header::before { background: var(--dimension-clr); }
    [data-era="manifesto"]  .album-header::before { background: var(--manifesto-clr); }
    [data-era="romance"]    .album-header::before { background: var(--romance-clr); }
    [data-era="new-horizon"].album-header::before { background: var(--horizon-clr); }
    [data-era="special"]    .album-header::before { background: var(--special-clr); }

    .song-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      margin: 2px 10px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .song-row:hover { background: var(--s2); }
    .song-row.active { background: var(--acc2); }

    .sr-num {
      font-family: 'Syne Mono', monospace;
      font-size: 10px;
      color: var(--dim);
      width: 20px;
      text-align: right;
      flex-shrink: 0;
    }

    .song-row.active .sr-num { color: var(--acc); font-weight: bold; }

    .sr-title {
      font-size: 13px;
      font-weight: 500;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-row.active .sr-title { color: var(--text); font-weight: 700; }

    .sr-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--dim);
      flex-shrink: 0;
      opacity: 0;
    }

    .song-row.is-title .sr-dot { opacity: 1; }
    .song-row.active .sr-dot { background: var(--acc); opacity: 1; box-shadow: 0 0 6px var(--acc); }

    .eq { display: none; align-items: flex-end; gap: 2px; height: 12px; flex-shrink: 0; }
    .song-row.active .eq { display: flex; }

    .eq span { width: 2px; background: var(--acc); border-radius: 1px; }
    .song-row.active.playing .eq span { animation: eq 0.65s ease-in-out infinite alternate; }
    .eq span:nth-child(1) { height: 4px;  animation-delay: 0s;    }
    .eq span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
    .eq span:nth-child(3) { height: 6px;  animation-delay: 0.3s;  }

    @keyframes eq {
      from { transform: scaleY(0.3); transform-origin: bottom; }
      to   { transform: scaleY(1);   transform-origin: bottom; }
    }

    .album-group.hidden { display: none; }

    /* ─── Main Content ────────────────────────────────────────────── */
    main {
      grid-area: mn;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    main::before {
      content: '';
      position: absolute;
      width: 800px; height: 800px;
      background: radial-gradient(circle, rgba(var(--acc-color), 0.08) 0%, transparent 70%);
      pointer-events: none;
      transition: background 1s ease;
    }

    /* Figma-inspired rounded album art */
    .art-wrap { 
      width: 320px; 
      height: 320px; 
      position: relative; 
      flex-shrink: 0;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
      overflow: hidden;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.5s ease;
    }

    .art-wrap.playing {
      transform: scale(1.03);
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 20px rgba(var(--acc-color), 0.2);
    }

    .album-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .album-cover-img.loaded {
      opacity: 1;
    }

    .track-info { text-align: center; z-index: 1; }

    .track-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      max-width: 480px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .track-album {
      margin-top: 8px;
      font-size: 13px;
      color: var(--dim2);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .track-era {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 12px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--dim);
      background: var(--s2);
    }

    .idle-state {
      text-align: center;
      z-index: 1;
    }

    .idle-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 80px;
      letter-spacing: 16px;
      color: rgba(255, 255, 255, 0.05);
      line-height: 1;
    }

    .idle-sub {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 16px;
    }

    #toast {
      position: fixed;
      bottom: 140px; left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 10, 10, 0.9);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 0, 0, 0.2);
      border-radius: 8px;
      color: #ff6b6b;
      font-size: 12px;
      padding: 10px 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 99;
      white-space: nowrap;
    }

    #toast.show { opacity: 1; }

    /* ─── Player bar ──────────────────────────────────────── */
    .player-bar {
      grid-area: pb;
      background: var(--s1);
      border-top: 1px solid var(--border);
      padding: 16px 40px 20px;
      backdrop-filter: blur(15px);
      z-index: 10;
    }

    .prog-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .tc {
      font-family: 'Syne Mono', monospace;
      font-size: 11px;
      color: var(--dim);
      width: 40px;
      flex-shrink: 0;
    }
    .tc.r { text-align: right; }

    .prog-track {
      flex: 1;
      height: 4px;
      background: var(--s3);
      cursor: pointer;
      position: relative;
      border-radius: 2px;
      overflow: hidden;
      transition: height 0.1s;
    }
    .prog-track:hover { height: 6px; }

    .prog-fill {
      height: 100%;
      background: var(--acc);
      width: 0%;
      pointer-events: none;
      transition: width 0.1s linear;
      box-shadow: 0 0 10px var(--acc);
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .ctrl {
      background: none; border: none;
      color: var(--dim); cursor: pointer;
      font-size: 20px; line-height: 1;
      padding: 8px;
      transition: color 0.2s, transform 0.2s;
    }
    .ctrl:hover { color: var(--text); transform: scale(1.1); }

    .play-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--text);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #000; font-size: 22px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .play-btn:hover { 
      transform: scale(1.05); 
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); 
    }

    .vol-wrap {
      display: flex; align-items: center; gap: 10px;
      margin-left: auto;
    }

    .vol-icon { font-size: 16px; color: var(--dim); cursor: pointer; transition: color 0.2s; }
    .vol-icon:hover { color: var(--text); }

    input[type=range] {
      -webkit-appearance: none;
      width: 90px; height: 4px;
      background: var(--s3); outline: none;
      cursor: pointer; border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%; background: var(--text); cursor: pointer;
    }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo">ENHYPEN</div>
    <div class="sep"></div>
    <div class="tagline">Complete Discography</div>
    <div class="now-header" id="nowHeader" style="display:none;">
      <div class="nh-dot" id="nhDot" style="display:none;"></div>
      <div class="nh-title" id="nhTitle"></div>
      <div class="nh-album" id="nhAlbum"></div>
    </div>
  </header>

  <aside>
    <div class="era-tabs" id="eraTabs"></div>
    <div class="song-list" id="songList"></div>
  </aside>

  <main id="mainArea">
    <div class="idle-state" id="idleState">
      <div class="idle-logo">ENHYPEN</div>
      <div class="idle-sub">Select a song to play</div>
    </div>

    <div id="trackDisplay" style="display:none; flex-direction:column; align-items:center; gap:32px;">
      <div class="art-wrap" id="artWrap">
        <img id="albumCoverImg" class="album-cover-img" src="" alt="Album Cover">
      </div>
      <div class="track-info">
        <div class="track-title" id="trackTitle"></div>
        <div class="track-album" id="trackAlbum"></div>
        <div class="track-era"   id="trackEra"></div>
      </div>
    </div>
  </main>

  <div class="player-bar">
    <div class="prog-row">
      <div class="tc" id="tCur">0:00</div>
      <div class="prog-track" id="progTrack" onclick="seek(event)">
        <div class="prog-fill" id="progFill"></div>
      </div>
      <div class="tc r" id="tTot">0:00</div>
      <div class="vol-wrap">
        <div class="vol-icon" onclick="toggleMute()">&#128266;</div>
        <input type="range" id="vol" min="0" max="1" step="0.02" value="1" oninput="setVol(this.value)" />
      </div>
    </div>
    <div class="ctrl-row">
      <button class="ctrl" title="Previous  ←" onclick="prev()">&#9664;&#9664;</button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()">&#9654;</button>
      <button class="ctrl" title="Next  →" onclick="next()">&#9654;&#9654;</button>
    </div>
  </div>

</div>

<div id="toast"></div>
<audio id="audio"></audio>

<script>
  let data      = null;
  let flatSongs = [];   
  let cur       = -1;
  let muted     = false;
  let prevVol   = 1;
  const audio   = document.getElementById('audio');
  let activeEra = 'all';

  // Dynamic themes for each era (RGB format)
  const eraThemes = {
    'border':      { bg: '12, 14, 15', acc: '79, 195, 247' },  // Grunge / Blue
    'dimension':   { bg: '15, 10, 20', acc: '179, 157, 219' }, // Purple / Dreamy
    'manifesto':   { bg: '18, 5, 5',   acc: '239, 154, 154' }, // Aggressive Red
    'romance':     { bg: '20, 12, 15', acc: '244, 143, 177' }, // Soft Pink / Cinematic
    'new-horizon': { bg: '10, 15, 10', acc: '198, 241, 53' },  // Neon Green
    'special':     { bg: '15, 12, 5',  acc: '255, 213, 79' },  // Gold
    'default':     { bg: '15, 10, 10', acc: '200, 200, 200' }  // Base
  };

  fetch('songs.json')
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(json => { data = json; init(); })
    .catch(() => showToast('Could not load songs.json — make sure it is in the same folder.'));

  function init() {
    let gi = 0;
    data.eras.forEach(era => {
      era.albums.forEach(album => {
        album.songs.forEach(s => {
          flatSongs.push({
            title:  s.title,
            file:   'songs/' + s.file,
            album:  album.name,
            year:   album.year,
            era:    era.name,
            eraId:  era.id,
            cover:  s.cover || album.cover,
            isTitle: !!s.title_track,
            globalIndex: gi++
          });
        });
      });
    });

    buildEraTabs();
    buildSongList();
  }

  function applyTheme(eraId) {
    const theme = eraThemes[eraId] || eraThemes['default'];
    document.documentElement.style.setProperty('--bg-color', theme.bg);
    document.documentElement.style.setProperty('--acc-color', theme.acc);
  }

  function buildEraTabs() {
    const tabs = document.getElementById('eraTabs');
    tabs.innerHTML = '';

    const allBtn = makeTab('all', 'All');
    tabs.appendChild(allBtn);

    data.eras.forEach(era => {
      tabs.appendChild(makeTab(era.id, era.name));
    });
  }

  function makeTab(id, label) {
    const btn = document.createElement('button');
    btn.className = 'era-tab' + (id === activeEra ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => filterEra(id);
    btn.dataset.eraId = id;
    return btn;
  }

  function filterEra(id) {
    activeEra = id;
    document.querySelectorAll('.era-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.eraId === id);
    });
    document.querySelectorAll('.album-group').forEach(g => {
      g.classList.toggle('hidden', id !== 'all' && g.dataset.era !== id);
    });
  }

  function buildSongList() {
    const list = document.getElementById('songList');
    list.innerHTML = '';
    let gi = 0;

    data.eras.forEach(era => {
      era.albums.forEach(album => {
        const group = document.createElement('div');
        group.className = 'album-group';
        group.dataset.era = era.id;

        const hdr = document.createElement('div');
        hdr.className = 'album-header';
        hdr.innerHTML = `<div class="album-name">${album.name}</div><div class="album-year">${album.year} · ${era.name}</div>`;
        group.appendChild(hdr);

        album.songs.forEach((s, i) => {
          const index = gi++;
          const row = document.createElement('div');
          row.className = 'song-row' + (s.title_track ? ' is-title' : '');
          row.id = `sr-${index}`;
          row.innerHTML = `
            <div class="sr-num">${String(i + 1).padStart(2, '0')}</div>
            <div class="sr-title" title="${s.title}">${s.title}</div>
            <div class="sr-dot"></div>
            <div class="eq"><span></span><span></span><span></span></div>`;
          row.onclick = () => play(index);
          group.appendChild(row);
        });

        list.appendChild(group);
      });
    });
  }

  function play(index) {
    if (index < 0 || index >= flatSongs.length) return;

    if (cur >= 0) {
      document.getElementById(`sr-${cur}`)?.classList.remove('active', 'playing');
    }

    cur = index;
    const s = flatSongs[cur];

    // Shift Theme Colors based on Era
    applyTheme(s.eraId);

    const row = document.getElementById(`sr-${cur}`);
    if (row) {
      row.classList.add('active');
      row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.getElementById('idleState').style.display     = 'none';
    document.getElementById('trackDisplay').style.display  = 'flex';
    document.getElementById('trackTitle').textContent      = s.title;
    document.getElementById('trackAlbum').textContent      = s.album;
    document.getElementById('trackEra').textContent        = s.era + ' · ' + s.year;

    document.getElementById('nowHeader').style.display = 'flex';
    document.getElementById('nhTitle').textContent     = s.title;
    document.getElementById('nhAlbum').textContent     = s.album;

    // Handle Image Swapping smoothly
    const coverImg = document.getElementById('albumCoverImg');
    coverImg.classList.remove('loaded'); 
    
    setTimeout(() => {
      // Fallback in case image is missing
      coverImg.src = s.cover || 'images/default-cover.jpg'; 
      coverImg.onload = () => coverImg.classList.add('loaded');
      coverImg.onerror = () => { 
        coverImg.src = ''; 
        console.warn('Cover image missing for: ' + s.album);
      };
    }, 200);

    audio.src = s.file;
    audio.load();
    audio.play().catch(() => {
      showToast(`"${s.title}" — file not found in songs/ folder`);
    });
  }

  function togglePlay() {
    if (cur < 0) return;
    audio.paused ? audio.play() : audio.pause();
  }

  function next() {
    if (!flatSongs.length) return;
    play((cur + 1) % flatSongs.length);
  }

  function prev() {
    if (!flatSongs.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    play((cur - 1 + flatSongs.length) % flatSongs.length);
  }

  function seek(e) {
    if (!audio.duration) return;
    const r = document.getElementById('progTrack').getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  }

  function setVol(v) {
    audio.volume = parseFloat(v);
    muted = audio.volume === 0;
  }

  function toggleMute() {
    if (muted) {
      audio.volume = prevVol;
      document.getElementById('vol').value = prevVol;
    } else {
      prevVol = audio.volume;
      audio.volume = 0;
      document.getElementById('vol').value = 0;
    }
    muted = !muted;
  }

  audio.addEventListener('play', () => {
    document.getElementById('playBtn').innerHTML   = '&#9646;&#9646;';
    document.getElementById('artWrap').classList.add('playing');
    document.getElementById('nhDot').style.display = 'block';
    document.getElementById(`sr-${cur}`)?.classList.add('playing');
  });

  audio.addEventListener('pause', () => {
    document.getElementById('playBtn').innerHTML    = '&#9654;';
    document.getElementById('artWrap').classList.remove('playing');
    document.getElementById('nhDot').style.display  = 'none';
    document.getElementById(`sr-${cur}`)?.classList.remove('playing');
  });

  audio.addEventListener('ended', next);

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    document.getElementById('progFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
    document.getElementById('tCur').textContent = fmt(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('tTot').textContent = fmt(audio.duration);
  });

  function fmt(s) {
    return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') next();
    if (e.code === 'ArrowLeft')  prev();
    if (e.code === 'KeyM')       toggleMute();
  });
</script>
</body>
</html>
